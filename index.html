<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double XP — Respawns planilhados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0d0a; --bg2:#17130e; --card:#1d1812; --card2:#241e16; --line:#3a2f20;
  --gold:#e0b552; --gold2:#a9822f; --text:#ece3d2; --muted:#9c8f78; --free:#5d8a4a;
  --hl:#ffda6b; --now:#c4452b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
body{background:radial-gradient(1200px 600px at 50% -200px,#2b2114 0%,transparent 70%),var(--bg)}
header{position:sticky;top:0;z-index:20;background:rgba(15,13,10,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 20px 10px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-family:Cinzel,serif;font-weight:800;color:var(--gold);margin:0;font-size:22px;letter-spacing:.5px}
h1 small{display:block;font-family:Inter;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--free);box-shadow:0 0 8px var(--free)}
.dot.err{background:var(--now);box-shadow:0 0 8px var(--now)}
.dot.load{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
button,.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--gold2)}
button.on{background:var(--gold);color:#1a1307;border-color:var(--gold);font-weight:600}
.days{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.days button{padding:6px 12px}
.days button .today{font-size:10px;margin-left:6px;color:var(--now);font-weight:700}
.days button.on .today{color:#5a1408}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;font:inherit;min-width:240px}
input[type=search]:focus{outline:none;border-color:var(--gold2)}
select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.top,.days,.tools{max-width:1460px;margin-left:auto;margin-right:auto}
.slots{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
.slots button{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12px;position:relative}
.slots button.now:not(.on){border-color:var(--now);color:#ffb3a3}
.slots button .cnt{opacity:.6;margin-left:4px;font-size:11px}
.group{margin-bottom:26px}
.group h2{font-family:Cinzel,serif;color:var(--gold);font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.group h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.card.free{opacity:.55}
.card.match{border-color:var(--hl);box-shadow:0 0 0 1px var(--hl),0 0 18px rgba(255,218,107,.15)}
.card .name{font-weight:700;font-size:14px}
.card .sub{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.mobs{display:flex;gap:4px;flex-wrap:wrap;min-height:40px;align-items:flex-end}
.mobs img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated;background:rgba(255,255,255,.03);border-radius:6px}
.mobs .noimg{width:48px;height:48px;border-radius:6px;background:rgba(255,255,255,.04);display:grid;place-items:center;color:var(--muted);font-size:20px}
.who{background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px;white-space:pre-wrap;line-height:1.4;word-break:break-word}
.who.empty{color:var(--free);font-style:italic}
.list{display:flex;flex-direction:column;gap:3px;font-size:12px}
.row{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:4px 6px;border-radius:6px}
.row:nth-child(odd){background:rgba(0,0,0,.18)}
.row .t{color:var(--muted);font-variant-numeric:tabular-nums}
.row.now{outline:1px solid var(--now)}
.row.match{background:rgba(255,218,107,.14)}
.row .p{white-space:pre-wrap;word-break:break-word}
.row .p.empty{color:var(--free);font-style:italic}
mark{background:var(--hl);color:#1a1307;border-radius:3px;padding:0 2px}
.empty-state{color:var(--muted);text-align:center;padding:60px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:760px;max-height:85vh;overflow:auto;padding:20px 24px}
.modal h3{font-family:Cinzel,serif;color:var(--gold);margin-top:0}
.modal p{margin:6px 0;line-height:1.5}
.err-box{background:#3a1710;border:1px solid var(--now);padding:12px;border-radius:10px;margin-bottom:14px}
footer{color:var(--muted);font-size:11px;text-align:center;padding:20px}
footer a{color:var(--gold2)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Double XP — Respawns<small id="evt">carregando planilha…</small></h1>
    <div class="spacer"></div>
    <div class="status"><span class="dot load" id="dot"></span><span id="upd">—</span></div>
    <button id="btnRefresh" title="Recarregar agora">↻ Atualizar</button>
    <button id="btnRules">📜 Regras</button>
    <a class="btn" id="lnkSheet" target="_blank" rel="noopener" style="text-decoration:none">Abrir planilha</a>
  </div>
  <div class="days" id="days"></div>
  <div class="tools">
    <div class="seg" id="viewSeg">
      <button data-v="slot" class="on">Por horário</button>
      <button data-v="resp">Por respawn</button>
    </div>
    <input type="search" id="q" placeholder="Buscar jogador ou respawn…">
    <select id="grp"><option value="">Todas as hunts</option></select>
    <label style="color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="onlyBusy"> só ocupados</label>
  </div>
</header>

<main>
  <div id="err"></div>
  <div class="slots" id="slots"></div>
  <div id="content"><div class="empty-state">Carregando…</div></div>
</main>

<div class="modal" id="rules"><div class="box"><h3>Regras</h3><div id="rulesBody">—</div><p style="margin-top:16px"><button onclick="closeRules()">Fechar</button></p></div></div>

142023", "Tremendous Tyrant": "3/3e|20210527061915", "True Dawnfire Asura": "1/14|20180607130128", "True Frost Flower Asura": "9/9a|20180607130127", "True Midnight Asura": "a/a6|20180607130128", "Turbulent Elemental": "f/f7|20220602201946", "Undead Dragon": "6/6f|20171218212220", "Undertaker": "a/a1|20220621121115", "Varg": "9/92|20250628082354", "Varnished Diremaw": "2/26|20210527010243", "Venerable Girtablilu": "1/10|20210527030048", "Vexclaw": "e/ed|20151112213544", "Vibrant Phantom": "b/bc|20200611061720", "Walking Dread": "7/73|20251108013603", "Walking Pillar": "2/26|20230613180239", "Wandering Pillar": "a/a2|20230613180241", "Wardragon": "7/70|20231114095055", "Werelion": "5/5c|20200611061712", "Werelioness": "7/71|20200611061713", "White Lion": "e/e9|20210209141036", "Young Goanna": "5/5e|20220507012014"}; // nome: "a/ab|cb[|arquivo]" — cb é o timestamp exigido pelo Fandom
const gif = n => { const f=n.replace(/ /g,'_')+'.gif'; if(GIF_PATH[n]){ const [p,cb,file]=GIF_PATH[n].split('|'); const f2=file||f; return `https://static.wikia.nocookie.net/tibia/images/${p}/${encodeURIComponent(f2)}/revision/latest?cb=${cb}&path-prefix=en`; } return 'https://tibia.fandom.com/wiki/Special:FilePath/'+encodeURIComponent(f); };
const $ = id => document.getElementById(id);

const state = { data:{}, day:null, view:'slot', slot:null, q:'', grp:'', onlyBusy:false, rules:null, userPickedSlot:false };
try{ const s=JSON.parse(localStorage.getItem('dxp-ui')||'{}'); if(s.view) state.view=s.view; }catch(e){}

/* ---------- carregamento (JSONP do gviz, funciona sem servidor) ---------- */
let reqN = 0;
function loadTab(tab){
  return new Promise((res,rej)=>{
    const cb = '__gv' + (++reqN);
    const s = document.createElement('script');
    const t = setTimeout(()=>{cleanup(); rej(new Error('timeout em '+tab));}, 20000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = r => { cleanup(); r.status==='error' ? rej(new Error((r.errors||[{}])[0].detailed_message||'erro')) : res(r.table); };
    s.onerror = ()=>{ cleanup(); rej(new Error('falha de rede em '+tab)); };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=0&tqx=responseHandler:${cb}&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
const cellText = c => c==null ? '' : (c.f!=null ? String(c.f) : (c.v==null ? '' : String(c.v)));
const tableToRows = table => table.rows.map(r => r.c.map(cellText));
function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  row.push(f); rows.push(row); return rows;
}
// 1ª tentativa: fetch do CSV (CORS liberado pelo Google); se falhar, JSONP
async function loadRows(tab){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=0&tqx=out:csv&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
  try{
    const r = await fetch(url, {credentials:'omit', cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return parseCSV(await r.text());
  }catch(e){
    console.warn('fetch falhou, tentando JSONP', tab, e);
    return tableToRows(await loadTab(tab));
  }
}

function parseDay(rows){
  const hi = rows.findIndex(r => norm(r[0]).startsWith('hora'));
  if(hi < 1) return null;
  const top = rows[hi-1], head = rows[hi];
  const cols = []; let grp = '';
  for(let i=1;i<head.length;i++){
    if(top[i] && norm(top[i])!=='hunts') grp = top[i].trim();
    const name = (head[i]||'').trim();
    if(!name || norm(name).startsWith('hora')) continue;
    cols.push({i, name, grp: grp||'Outras', key: norm(name)});
  }
  const slots = [];
  for(let r=hi+1;r<rows.length;r++){
    const t = (rows[r][0]||'').trim();
    if(!/\d{1,2}:\d{2}/.test(t)) continue;
    slots.push({ label:t, cells: cols.map(c => (rows[r][c.i]||'').trim()) });
  }
  return { cols, slots };
}

async function refresh(){
  $('dot').className='dot load';
  try{
    const res = await Promise.all(DAY_TABS.map(t => loadRows(t).then(parseDay).catch(e=>({error:e.message}))));
    DAY_TABS.forEach((t,i)=> state.data[t]=res[i]);
    if(!state.rules){ loadRows(RULES_TAB).then(rows=>{ state.rules=rows; renderHeaderInfo(); }).catch(()=>{}); }
    const fails = res.filter(r=>!r||r.error);
    $('err').innerHTML = fails.length===DAY_TABS.length
      ? `<div class="err-box">Não consegui ler a planilha (${esc((fails[0]||{}).error||'sem dados')}). Confira: (1) o arquivo foi baixado e aberto direto no navegador (pré-visualizações dentro de apps bloqueiam acesso externo); (2) a planilha está como "qualquer pessoa com o link pode ver".</div>` : '';
    $('dot').className = fails.length ? 'dot err' : 'dot';
    $('upd').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(e){
    $('dot').className='dot err'; $('upd').textContent='erro: '+e.message;
  }
  if(!state.day) state.day = guessToday();
  render();
}

/* ---------- datas / horário atual ---------- */
function gameNow(){ // retorna {dayNum, minutes} considerando server save
  const d = new Date(); const [sh,sm]=SERVER_SAVE.split(':').map(Number);
  let mins = d.getHours()*60+d.getMinutes();
  const g = new Date(d); if(mins < sh*60+sm) g.setDate(g.getDate()-1);
  return { dayNum: g.getDate(), mins };
}
const tabDay = t => +((t.match(/\((\d+)\)/)||[])[1]||0);
function todayTab(){ const n=gameNow().dayNum; return DAY_TABS.find(t=>tabDay(t)===n) || null; }
function guessToday(){ return todayTab() || DAY_TABS[0]; }
function slotIsNow(label, tab){
  if(tabDay(tab)!==gameNow().dayNum) return false;
  const m = label.match(/(\d{1,2}):(\d{2}).*?(\d{1,2}):(\d{2})/); if(!m) return false;
  const [sh,sm] = SERVER_SAVE.split(':').map(Number), base = sh*60+sm;
  const rel = x => (x - base + 1440) % 1440;
  const a = rel(+m[1]*60+ +m[2]), b = rel(+m[3]*60+ +m[4]) || 1440, n = rel(gameNow().mins);
  return n>=a && n<b;
}

/* ---------- render ---------- */
function renderHeaderInfo(){
  const r = state.rules; if(!r) return;
  const flat = r.map(x=>x.filter(Boolean));
  const ev = flat.find(x=>x.some(v=>/double/i.test(v)) && x.length>2);
  if(ev) $('evt').textContent = 'Evento: ' + (ev[ev.length-1]||'') ;
  const lines = flat.map(x=>x.join(' · ')).filter(Boolean);
  const start = lines.findIndex(l=>/REGRAS/i.test(l));
  $('rulesBody').innerHTML = (start>=0?lines.slice(start+1):lines).map(l=>`<p>${esc(l)}</p>`).join('');
}
function hl(text){
  if(!state.q) return esc(text);
  const re = new RegExp('('+state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return esc(text).replace(re,'<mark>$1</mark>');
}
const strip = s => norm(s).replace(/\s*\(.*?\)\s*/g,' ').trim();
const MOBS_STRIP = Object.fromEntries(Object.entries(MOBS).map(([k,v])=>[strip(k),v]));
function mobsHtml(key){
  const list = MOBS[key] || MOBS_STRIP[strip(key)];
  if(!list || !list.length) return `<div class="mobs"><div class="noimg">⚔</div></div>`;
  return `<div class="mobs">${list.map(n=>`<img loading="lazy" referrerpolicy="no-referrer" src="${gif(n)}" alt="${esc(n)}" title="${esc(n)}" onerror="this.outerHTML='<div class=noimg title=&quot;${esc(n)}&quot;>?</div>'">`).join('')}</div>`;
}
function renderDays(){
  const today = todayTab();
  $('days').innerHTML = DAY_TABS.map(t=>`<button data-d="${esc(t)}" class="${t===state.day?'on':''}">${esc(t)}${t===today?'<span class="today">HOJE</span>':''}</button>`).join('');
}
function render(){
  renderDays();
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.view));
  const d = state.data[state.day];
  if(!d || d.error){ $('slots').innerHTML=''; $('content').innerHTML=`<div class="empty-state">${d&&d.error?'Erro ao ler a aba: '+esc(d.error):'Sem dados para esta aba.'}</div>`; return; }

  // filtro de hunts
  const groups = [...new Set(d.cols.map(c=>c.grp))];
  const sel=$('grp'); const cur=state.grp;
  sel.innerHTML = '<option value="">Todas as hunts</option>' + groups.map(g=>`<option ${g===cur?'selected':''}>${esc(g)}</option>`).join('');
  if(cur && !groups.includes(cur)) state.grp='';

  const q = norm(state.q);
  const matchCell = (txt,col) => q && (norm(txt).includes(q) || col.key.includes(q) || norm(col.grp).includes(q));

  if(state.view==='slot'){
    const nowIdx = d.slots.findIndex(s=>slotIsNow(s.label,state.day));
    if(state.slot==null || state.slot>=d.slots.length || (!state.userPickedSlot && nowIdx>=0)) state.slot = nowIdx>=0?nowIdx:0;
    $('slots').innerHTML = d.slots.map((s,i)=>{
      const busy = s.cells.filter(Boolean).length;
      const hit = q && s.cells.some((c,j)=>c && norm(c).includes(q));
      return `<button data-s="${i}" class="${i===state.slot?'on':''} ${i===nowIdx?'now':''}" style="${hit&&i!==state.slot?'border-color:var(--hl)':''}">${i===nowIdx?'● ':''}${esc(s.label.replace(/\s*as\s*/i,'–'))}<span class="cnt">${busy}</span></button>`;
    }).join('');
    const s = d.slots[state.slot];
    let html='';
    for(const g of groups){
      if(state.grp && g!==state.grp) continue;
      const cards = d.cols.map((c,j)=>({c,txt:s.cells[j]})).filter(x=>x.c.grp===g)
        .filter(x=>!state.onlyBusy || x.txt)
        .filter(x=>!q || matchCell(x.txt,x.c));
      if(!cards.length) continue;
      html += `<section class="group"><h2>${esc(g)}</h2><div class="grid">` + cards.map(({c,txt})=>`
        <div class="card ${txt?'':'free'} ${q&&matchCell(txt,c)?'match':''}">
          ${mobsHtml(c.key)}
          <div><div class="sub">${esc(c.grp)}</div><div class="name">${hl(c.name)}</div></div>
          <div class="who ${txt?'':'empty'}">${txt?hl(txt):'livre'}</div>
        </div>`).join('') + `</div></section>`;
    }
    $('content').innerHTML = html || '<div class="empty-state">Nada encontrado nesse horário.</div>';
  } else {
    $('slots').innerHTML='';
    let html='';
    for(const g of groups){
      if(state.grp && g!==state.grp) continue;
      const cols = d.cols.map((c,j)=>({c,j})).filter(x=>x.c.grp===g).filter(({c,j})=>{
        const any = d.slots.some(s=>s.cells[j]);
        if(state.onlyBusy && !any) return false;
        if(q) return c.key.includes(q) || norm(g).includes(q) || d.slots.some(s=>norm(s.cells[j]).includes(q));
        return true;
      });
      if(!cols.length) continue;
      html += `<section class="group"><h2>${esc(g)}</h2><div class="grid">` + cols.map(({c,j})=>{
        const rows = d.slots.map(s=>({s,txt:s.cells[j]})).filter(x=>!state.onlyBusy||x.txt);
        const used = d.slots.filter(s=>s.cells[j]).length;
        return `<div class="card">
          ${mobsHtml(c.key)}
          <div><div class="sub">${esc(c.grp)} · ${used}/${d.slots.length} horários</div><div class="name">${hl(c.name)}</div></div>
          <div class="list">${rows.map(({s,txt})=>`<div class="row ${slotIsNow(s.label,state.day)?'now':''} ${q&&txt&&norm(txt).includes(q)?'match':''}"><span class="t">${esc(s.label.replace(/\s*as\s*/i,'–'))}</span><span class="p ${txt?'':'empty'}">${txt?hl(txt):'livre'}</span></div>`).join('')}</div>
        </div>`;}).join('') + `</div></section>`;
    }
    $('content').innerHTML = html || '<div class="empty-state">Nada encontrado.</div>';
  }
}

/* ---------- eventos ---------- */
$('days').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; state.day=b.dataset.d; state.slot=null; state.userPickedSlot=false; render(); };
$('slots').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; state.slot=+b.dataset.s; state.userPickedSlot=true; render(); };
$('viewSeg').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; state.view=b.dataset.v; try{localStorage.setItem('dxp-ui',JSON.stringify({view:state.view}))}catch(_){} render(); };
$('q').oninput = e=>{ state.q=e.target.value.trim(); render(); };
$('grp').onchange = e=>{ state.grp=e.target.value; render(); };
$('onlyBusy').onchange = e=>{ state.onlyBusy=e.target.checked; render(); };
$('btnRefresh').onclick = refresh;
$('btnRules').onclick = ()=>$('rules').classList.add('open');
function closeRules(){ $('rules').classList.remove('open'); }
$('rules').onclick = e=>{ if(e.target.id==='rules') closeRules(); };
$('lnkSheet').href = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
$('ivl').textContent = REFRESH_MIN;

refresh();
setInterval(refresh, REFRESH_MIN*60*1000);
setInterval(()=>{ if(!state.userPickedSlot) render(); }, 60*1000); // acompanha o horário atual
</script>
